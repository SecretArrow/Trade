version: 2
# Major bumps of the build/tooling stack are handled manually to keep the
# pipeline stable; Dependabot continues to propose minor and patch updates.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    ignore:
      - update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    labels:
