name: Autofix

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read

jobs:
  autofix:
    name: Auto-fix lint/format or report failures
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !contains(github.event.workflow_run.head_commit.message, '[autofix]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      issues: write
    steps:
      - name: Inspect failed jobs
        id: failed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api --slurp --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            | jq -r '.[].jobs[] | select(.conclusion == "failure") | .name' > failed.txt || true
          cat failed.txt
          {
            if grep -qE 'Lint' failed.txt; then echo 'lint_failed=true'; else echo 'lint_failed=false'; fi
            if grep -qE 'Unit|E2E|Live data|Build web|Deploy' failed.txt; then echo 'tests_failed=true'; else echo 'tests_failed=false'; fi
            if grep -qE 'Secret scan' failed.txt; then echo 'security_failed=true'; else echo 'security_failed=false'; fi
          } >> "$GITHUB_OUTPUT"
      - name: Checkout head of failed run
        if: steps.failed.outputs.lint_failed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up pnpm
        if: steps.failed.outputs.lint_failed == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - name: Set up Node
        if: steps.failed.outputs.lint_failed == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.failed.outputs.lint_failed == 'true'
        run: pnpm install --frozen-lockfile
      - name: Apply fixes
        if: steps.failed.outputs.lint_failed == 'true'
        run: |
          pnpm exec eslint . --fix || true
          pnpm exec prettier --write .
      - name: Commit and push (loop-guarded)
        if: steps.failed.outputs.lint_failed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then echo 'Nothing to fix'; exit 0; fi
          git add -A
          git commit -m 'style: apply automated lint and format fixes [autofix] [skip ci]'
          git push
      - name: Report failures as issue
        if: steps.failed.outputs.tests_failed == 'true' || steps.failed.outputs.security_failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          {
            echo 'Automated CI failure report.'
            echo ''
            echo 'Failing jobs:'
            sed 's/^/- /' failed.txt
            echo ''
            echo "Run: $RUN_URL"
            echo ''
            echo 'This issue is labeled `needs-agent` for automated follow-up.'
          } > issue-body.md
          gh label create needs-agent --color d73a4a --description 'CI failure that needs an agent to fix' 2>/dev/null || true
          existing=$(gh issue list --label needs-agent --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            gh issue create --title 'CI failure needs attention' --body-file issue-body.md --label needs-agent
          fi
